<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>메가박스</title>
</head>

<body>
    <header>
        <nav>
            <div class="head-menu"></div>      
        </nav>
    </header>
    

    <main>
        <section class="main-top">
            <div class="box-office">
                <div class="title">
                    <h4>박스오피스</h4>
                    <p>더 많은 영화보기 +</p>
                </div>

                <div class="poster">
                    <div class="movie">
                        <img src="../poster1.jpg" alt="오디세이">
                        <div class="active">
                          <p class="like">♡4.5k</p>
                          <a href="???" class="reservation">예매</a>
                        </div>                    
                    </div>

                    <div class="movie">
                        <img src="../poster2.jpg" alt="인턴">
                        <div class="active">
                          <p class="like">♡ 429</p>
                          <a href="???" class="reservation">예매</a>
                        </div>                    
                    </div>

                    <div class="movie">
                        <img src="../poster3.jpg" alt="암살자들">
                        <div class="active">
                          <p class="like">♡ 470</p>
                          <a href="???" class="reservation">예매</a>
                        </div>                    
                    </div>

                    <div class="movie">
                        <img src="../poster4.jpg" alt="비광">
                        <div class="active">
                          <p class="like">♡ 243</p>
                          <a href="???" class="reservation">예매</a>
                        </div>                    
                    </div>
                        
                </div>


                <div class="info">
                    <input type="text" placeholder="영화명을 입력해주세요  🔎">
                    <p>상영시간표</p>
                    <p>박스오피스</p>
                    <p>빠른예매</p>
                </div>
            </div>    
        </section>


        <section class="main-top-middle">
            <div class="membership">
                <h2>혜택</h2>

                <div class="left">
                    <div class="membership-top">
                        <div class="membership-info">
                            <h3>메가박스 오리지널 티켓</h3>
                            <h1>ORIGINAL TICKET</h1>
                            <p>메가박스가 제안하는 &lt;싱 어게인&gt;을 가장 잘 간직하는 방법</p>
                            <div class="page-bar"></div>
                            <span>&lt;</span>
                            <span>&gt;</span>
                            <span>▶</span>
                            <span>1/2</span>
                        </div>
                        <img src="../image2.jpg" alt="싱어게인">
                    </div>
                
                    <div class="membership-bottom">
                        <img src="../toss_image.png" alt="토스 무제한할인">
                        <img src="../toss_image2.png" alt="토스 즉시할인">
                    </div>
                </div>

                <img src="../4k image.jpg" alt="아비정전">
            </div>


            <div class="membership-menu">
                <div class="vip">
                    <p>💎</p>
                    <p>VIP LOUNGE</p>
                </div>
                <div class="member">
                    <p>💎</p>
                    <p>멤버십</p>
                </div>
                <div class="dc-card">
                    <p>💎</p>
                    <p>할인카드안내</p>
                </div>
                <div class="event">
                    <p>💎</p>
                    <p>이벤트</p>
                </div>
                <div class="store">
                    <p>💎</p>
                    <p>스토어</p>
                </div>
            </div>
        </section>


        <section class="">

        </section>


        <section>

        </section>
    </main>



    <footer>
        <div class="foot"></div>
    </footer>
</body>
</html>
